spring.application.name=backend

# Podatki za bazo se preberejo iz datoteke .env v korenu projekta (ni v gitu)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# PostgreSQL konfiguracija
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Ne poženi data.sql (podatki so že v bazi)
spring.sql.init.mode=never

# Swagger / OpenAPI konfiguracija
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

# Jackson konfiguracija za LocalDate/LocalTime
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd