spring.application.name=backend

#Baza konfiguracija, v localhost://8080/h2-console vpiši jdbc:h2:mem:testdb, username: sa, password: /
spring.datasource.url=jdbc:h2:mem:testdb;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#pregled baze na http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Izpiši SQL poizvedbe v konzolo
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#Da se inicializira sql datoteka ob zagonu aplikacije
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create
#Najprej se inicializira baza
spring.jpa.defer-datasource-initialization=true

#Prompt: Konfiguracija H2 baze in inicializacije v application.properties:, pa sem potem malo po malo kopiral v datoteko